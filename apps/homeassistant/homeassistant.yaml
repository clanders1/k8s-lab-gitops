apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: homeassistant-config-k8s
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: nutanix-volume-k8s
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homeassistant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: homeassistant
  template:
    metadata:
      labels:
        app: homeassistant
    spec:
      containers:
        - name: homeassistant
          image: ghcr.io/home-assistant/home-assistant@sha256:130241f28d01fa80dfa3b44f7d89781c188d8642ecab9024f079f19f9f82baa0
          ports:
            - containerPort: 8123
          env:
            - name: TZ
              value: America/Chicago
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1536Mi
          readinessProbe:
            tcpSocket:
              port: 8123
            initialDelaySeconds: 30
            periodSeconds: 15
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: homeassistant-config-k8s
---
apiVersion: v1
kind: Service
metadata:
  name: homeassistant
  annotations:
    metallb.universe.tf/loadBalancerIPs: 192.168.15.62
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: homeassistant
  ports:
    - port: 8123
      targetPort: 8123
